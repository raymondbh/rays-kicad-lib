name: Validate library

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install --yes ngspice

      - name: Validate symbol and model mappings
        run: python tools/validate_library.py

      - name: Run ngspice smoke test
        run: |
          for netlist in tests/smoke/all_models.cir tests/smoke/opamps.cir tests/smoke/ua741_transient.cir; do
            log="$(basename "$netlist" .cir).log"
            if ! ngspice -b -o "$log" "$netlist"; then
              cat "$log"
              exit 1
            fi
            cat "$log"
          done

      - name: Build PCM package
        run: python tools/build_pcm_package.py

      - name: List package contents
        run: python -m zipfile --list dist/*.zip
